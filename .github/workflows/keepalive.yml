name: Keep Render Services Awake

on:
  schedule:
    # Run every 10 minutes to prevent the 15-minute inactivity timeout
    - cron: "*/10 * * * *"
  workflow_dispatch: # Allows you to manually trigger it from the GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ML Service
        run: |
          curl -s https://nagar-drishti-ml.onrender.com/ml/health || true
          curl -s https://nagar-drishti-ml.onrender.com/anpr/health || true

      - name: Ping Node Backend
        # Replace this URL with your actual deployed Node.js backend Render URL!
        run: |
          curl -s https://YOUR-BACKEND-URL-HERE.onrender.com/api/health || true
